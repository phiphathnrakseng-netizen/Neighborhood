<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสมัครสมาชิกและเข้าสู่ระบบ - Neighborhood</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">
        <h2 id="form-title" class="text-2xl font-bold mb-6 text-center text-slate-800">เข้าสู่ระบบ</h2>

        <!-- Alert Box สำหรับแสดงข้อความแจ้งเตือน -->
        <div id="alert-box" class="hidden mb-4 p-3 rounded-lg text-sm text-center"></div>

        <!-- ฟอร์มสำหรับ Login / Register -->
        <form id="auth-form" onsubmit="handleSubmit(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">อีเมล (Email)</label>
                <input type="email" id="email" required 
                    class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="example@email.com">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">รหัสผ่าน (Password)</label>
                <input type="password" id="password" required 
                    class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="อย่างน้อย 6 ตัวขึ้นไป">
            </div>

            <button type="submit" id="submit-btn" 
                class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition font-medium">
                เข้าสู่ระบบ
            </button>
        </form>

        <!-- สลับโหมด Login / Register -->
        <div class="mt-6 text-center text-sm text-slate-600">
            <span id="switch-text">ยังไม่มีบัญชีใช่ไหม?</span>
            <button onclick="toggleMode()" id="switch-btn" class="text-blue-600 font-medium hover:underline ml-1">
                สมัครสมาชิก
            </button>
        </div>
    </div>

    <!-- ส่วน Dashboard หลังเข้าสู่ระบบสำเร็จ (ซ่อนไว้ก่อน) -->
    <div id="dashboard-container" class="hidden fixed inset-0 bg-slate-100 flex items-center justify-center">
        <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-lg text-center">
            <h1 class="text-3xl font-bold text-slate-800 mb-4">ยินดีต้อนรับสู่ระบบ! 🎉</h1>
            <p id="user-display-email" class="text-slate-600 mb-6"></p>
            <button onclick="handleLogout()" 
                class="bg-red-500 text-white px-6 py-2 rounded-lg hover:bg-red-600 transition font-medium">
                ออกจากระบบ
            </button>
        </div>
    </div>

    <script>
        // ตั้งค่าการเชื่อมต่อ Supabase ของคุณ
        const SUPABASE_URL = 'https://znpjitnfdbufismuwetsp.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpucGppdG5mZGJ1ZmlzbXV3ZXRzcCIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzczNzA5MTc5LCJleHAiOjIwODkyNjkxNzl9.Ym2_O1K3M8d8iR9881881881881881881881881881881'; 
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let isLoginMode = true; // สถานะเริ่มต้นเป็นหน้าเข้าสู่ระบบ

        // ฟังก์ชันสลับโหมดระหว่าง เข้าสู่ระบบ และ สมัครสมาชิก
        function toggleMode() {
            isLoginMode = !isLoginMode;
            const formTitle = document.getElementById('form-title');
            const submitBtn = document.getElementById('submit-btn');
            const switchText = document.getElementById('switch-text');
            const switchBtn = document.getElementById('switch-btn');
            const alertBox = document.getElementById('alert-box');
            
            alertBox.classList.add('hidden'); // ซ่อนแจ้งเตือนเมื่อเปลี่ยนโหมด

            if (isLoginMode) {
                formTitle.innerText = 'เข้าสู่ระบบ';
                submitBtn.innerText = 'เข้าสู่ระบบ';
                switchText.innerText = 'ยังไม่มีบัญชีใช่ไหม?';
                switchBtn.innerText = 'สมัครสมาชิก';
            } else {
                formTitle.innerText = 'สมัครสมาชิก';
                submitBtn.innerText = 'ยืนยันการสมัคร';
                switchText.innerText = 'มีบัญชีอยู่แล้วใช่ไหม?';
                switchBtn.innerText = 'เข้าสู่ระบบ';
            }
        }

        // ฟังก์ชันแสดงกล่องข้อความแจ้งเตือน
        function showAlert(message, isSuccess = false) {
            const alertBox = document.getElementById('alert-box');
            alertBox.innerText = message;
            alertBox.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-green-100', 'text-green-700');
            if (isSuccess) {
                alertBox.classList.add('bg-green-100', 'text-green-700');
            } else {
                alertBox.classList.add('bg-red-100', 'text-red-700');
            }
        }

        // ฟังก์ชันจัดการเมื่อกด Submit ฟอร์ม
        async function handleSubmit(event) {
            event.preventDefault();
            const emailInput = document.getElementById('email').value.trim();
            const passwordInput = document.getElementById('password').value.trim();

            if (isLoginMode) {
                // 1. ระบบเข้าสู่ระบบ (Login) ผ่าน Supabase Auth
                try {
                    const { data, error } = await supabase.auth.signInWithPassword({
                        email: emailInput,
                        password: passwordInput,
                    });

                    if (error) {
                        showAlert('อีเมลหรือรหัสผ่านไม่ถูกต้อง');
                    } else {
                        showAlert('เข้าสู่ระบบสำเร็จ!', true);
                        setTimeout(() => {
                            showDashboard(data.user.email);
                        }, 1000);
                    }
                } catch (err) {
                    console.error(err);
                    showAlert('เกิดข้อผิดพลาดในการเชื่อมต่อระบบ');
                }
            } else {
                // 2. ระบบสมัครสมาชิก (Register) ผ่าน Supabase Auth
                try {
                    const { data, error } = await supabase.auth.signUp({
                        email: emailInput,
                        password: passwordInput,
                    });

                    if (error) {
                        console.error(error);
                        showAlert('สมัครไม่สำเร็จ: ' + error.message);
                    } else {
                        showAlert('สมัครสมาชิกสำเร็จ! กรุณาเข้าสู่ระบบ', true);
                        setTimeout(() => toggleMode(), 1500); // สลับกลับไปหน้า Login อัตโนมัติ
                    }
                } catch (err) {
                    console.error(err);
                    showAlert('เกิดข้อผิดพลาดในการสมัครสมาชิก');
                }
            }
        }

        // ฟังก์ชันแสดงหน้า Dashboard หลังจากล็อกอินสำเร็จ
        function showDashboard(email) {
            document.querySelector('.bg-white.p-8').parentElement.classList.add('hidden'); // ซ่อนฟอร์มล็อกอิน
            document.getElementById('dashboard-container').classList.remove('hidden'); // แสดงหน้าแดชบอร์ด
            document.getElementById('user-display-email').innerText = 'เข้าสู่ระบบด้วยอีเมล: ' + email;
        }

        // ฟังก์ชันออกจากระบบ (Logout)
        async function handleLogout() {
            await supabase.auth.signOut();
            window.location.reload(); // รีเฟรชหน้าเว็บกลับมาหน้าแรก
        }
    </script>
</body>
</html>
