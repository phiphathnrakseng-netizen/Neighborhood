<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสมัครสมาชิกและเข้าสู่ระบบ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">
        <h2 id="form-title" class="text-2xl font-bold mb-6 text-center text-slate-800">เข้าสู่ระบบ</h2>

        <!-- Alert Box สำหรับแสดงข้อความแจ้งเตือน -->
        <div id="alert-box" class="hidden mb-4 p-3 rounded-lg text-sm text-center"></div>

        <!-- ฟอร์ม -->
        <form id="auth-form" onsubmit="handleSubmit(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">ชื่อผู้ใช้ (Username)</label>
                <input type="text" id="username" required 
                    class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">รหัสผ่าน (Password)</label>
                <input type="password" id="password" required 
                    class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <button type="submit" id="submit-btn" 
                class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition font-medium">
                เข้าสู่ระบบ
            </button>
        </form>

        <!-- สลับโหมด Login / Register -->
        <div class="mt-6 text-center text-sm text-slate-600">
            <span id="switch-text">ยังไม่มีบัญชีใช่ไหม?</span>
            <button onclick="toggleMode()" id="switch-btn" class="text-blue-600 font-medium hover:underline ml-1">
                สมัครสมาชิก
            </button>
        </div>
    </div>

    <script>
        // ตั้งค่าการเชื่อมต่อ Supabase ของคุณ
        const SUPABASE_URL = 'https://znpjitnfdbufismuwetsp.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpucGppdG5mZGJ1ZmlzbXV3ZXRzcCIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzczNzA5MTc5LCJleHAiOjIwODkyNjkxNzl9.Ym2_O1K3M8d8iR9881881881881881881881881881881'; // ใส่ Anon Key ของคุณที่นี่
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let isLoginMode = true; // สถานะเริ่มต้นเป็นหน้าเข้าสู่ระบบ

        function toggleMode() {
            isLoginMode = !isLoginMode;
            const formTitle = document.getElementById('form-title');
            const submitBtn = document.getElementById('submit-btn');
            const switchText = document.getElementById('switch-text');
            const switchBtn = document.getElementById('switch-btn');
            const alertBox = document.getElementById('alert-box');
            
            alertBox.classList.add('hidden'); // ซ่อนแจ้งเตือนเมื่อเปลี่ยนโหมด

            if (isLoginMode) {
                formTitle.innerText = 'เข้าสู่ระบบ';
                submitBtn.innerText = 'เข้าสู่ระบบ';
                switchText.innerText = 'ยังไม่มีบัญชีใช่ไหม?';
                switchBtn.innerText = 'สมัครสมาชิก';
            } else {
                formTitle.innerText = 'สมัครสมาชิก';
                submitBtn.innerText = 'ยืนยันการสมัคร';
                switchText.innerText = 'มีบัญชีอยู่แล้วใช่ไหม?';
                switchBtn.innerText = 'เข้าสู่ระบบ';
            }
        }

        function showAlert(message, isSuccess = false) {
            const alertBox = document.getElementById('alert-box');
            alertBox.innerText = message;
            alertBox.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-green-100', 'text-green-700');
            if (isSuccess) {
                alertBox.classList.add('bg-green-100', 'text-green-700');
            } else {
                alertBox.classList.add('bg-red-100', 'text-red-700');
            }
        }

        async function handleSubmit(event) {
            event.preventDefault();
            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value.trim();

            if (isLoginMode) {
                // ระบบเข้าสู่ระบบ (Login) - ใช้ตาราง 'user'
                try {
                    const { data, error } = await supabase
                        .from('user')
                        .select('*')
                        .eq('username', usernameInput)
                        .eq('password', passwordInput)
                        .single();

                    if (error || !data) {
                        showAlert('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
                    } else {
                        showAlert('เข้าสู่ระบบสำเร็จ!', true);
                        // สามารถเขียนโค้ดเปลี่ยนหน้าเว็บไปหน้าหลักตรงนี้ได้
                    }
                } catch (err) {
                    console.error(err);
                    showAlert('เกิดข้อผิดพลาดในการเชื่อมต่อระบบ');
                }
            } else {
                // ระบบสมัครสมาชิก (Register) - ใช้ตาราง 'user'
                try {
                    // ตรวจสอบก่อนว่ามีชื่อผู้ใช้นี้ในระบบหรือยัง
                    const { data: existingUser } = await supabase
                        .from('user')
                        .select('username')
                        .eq('username', usernameInput)
                        .maybeSingle();

                    if (existingUser) {
                        showAlert('ชื่อนี้มีคนใช้แล้ว กรุณาใช้ชื่ออื่น');
                        return;
                    }

                    // บันทึกข้อมูลลงตาราง 'user'
                    const { error } = await supabase
                        .from('user')
                        .insert([{ username: usernameInput, password: passwordInput }]);

                    if (error) {
                        console.error(error);
                        showAlert('เกิดข้อผิดพลาดในการสมัครสมาชิก');
                    } else {
                        showAlert('สมัครสมาชิกและเข้าสู่ระบบสำเร็จ!', true);
                        setTimeout(() => toggleMode(), 1500); // สลับกลับไปหน้า Login อัตโนมัติหลัง 1.5 วิ
                    }
                } catch (err) {
                    console.error(err);
                    showAlert('เกิดข้อผิดพลาดในการสมัครสมาชิก');
                }
            }
        }
    </script>
</body>
</html>
